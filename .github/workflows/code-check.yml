name: Code Check

on:
  pull_request:
    branches: ["*"]

jobs:
  code-lint:
    runs-on: ubuntu-latest
    name: pnpm lint
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm lint

  format:
    runs-on: ubuntu-latest
    name: pnpm format
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm format

  public-js-budget:
    runs-on: ubuntu-latest
    name: Public JavaScript budgets
    env:
      AUTH_TRUST_HOST: "true"
      FIREBASE_PROJECT_ID: demo-royce-perf
      FIREBASE_CLIENT_EMAIL: ci@demo-royce-perf.iam.gserviceaccount.com
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-only-api-key
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-royce-perf
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate local-only build credentials
        run: |
          node --input-type=module <<'NODE'
          import { generateKeyPairSync, randomBytes } from "node:crypto"
          import { appendFileSync } from "node:fs"
          const { privateKey } = generateKeyPairSync("rsa", {
            modulusLength: 2048,
            privateKeyEncoding: { type: "pkcs8", format: "pem" },
            publicKeyEncoding: { type: "spki", format: "pem" },
          })
          appendFileSync(process.env.GITHUB_ENV, `AUTH_SECRET=${randomBytes(32).toString("hex")}\nFIREBASE_PRIVATE_KEY<<PERF_KEY\n${privateKey}PERF_KEY\n`)
          NODE
      - run: pnpm build:content
      - run: pnpm build:next
      - run: pnpm perf:check
      - run: pnpm perf:vitals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
